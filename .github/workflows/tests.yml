name: Windows tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: API semantics
        run: node tests/api-tests.cjs
      - name: Cache isolation and concurrency
        run: node tests/sync-cache-tests.cjs
      - name: Window lifecycle
        run: node tests/window-lifecycle-tests.cjs
