<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' https: data:; connect-src 'none'"><title>Syllo</title><link rel="icon" href="../assets/syllo-logo.png" type="image/png"><link rel="stylesheet" href="onboarding.css"></head><body><section id="connect"><div class="connection-card"><div class="connection-brand"><img class="connection-symbol" src="../assets/syllo-logo.png" alt="" width="58" height="58"><img class="wordmark" src="../assets/syllo-wordmark.svg" alt="Syllo"></div><p class="eyebrow">YOUR CAMPUS, IN ONE PLACE</p><h1>连接你的学校</h1><p class="intro">输入 Moodle 网址，在学校页面登录。课程、作业、公告、课件与成绩，整理到同一个学习空间。</p><form id="connection-form"><label for="site">学校 Moodle 网址</label><input id="site" type="url" placeholder="https://moodle.your-university.edu" required><label class="remember"><input type="checkbox" id="remember">在这台电脑上记住登录（本机加密保存）</label><button id="submit" type="submit">连接学校 <span>↗</span></button></form><p id="status" role="status"></p><p class="privacy">账号密码只在学校登录页面输入。学校的移动端授权可能包含写入权限；Syllo 读取学习信息，并按 Moodle 官方方式恢复网页登录，不提交或修改课程内容。</p><div class="modules"><span>课程</span><span>作业</span><span>通知</span><span>课件</span><span>成绩</span><span>日程</span></div><p class="prototype">桌面接入预览版 · 官方接口接入 · 第三方插件仍在适配</p></div></section><div id="board" hidden></div><button id="disconnect" hidden>切换学校 / 退出连接</button><script src="../identity.js"></script><script src="../visuals.js"></script><script src="../theme.js"></script><script src="../semesters.js"></script><script src="../board.js"></script><script src="renderer.js"></script></body></html>
